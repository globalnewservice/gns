pe="password" placeholder="Password" autocomplete="off" aria-label="Password" required><button type="submit">Sign in</button><div id="gns-error" role="alert"></div></form></section></div></div><script id="gns-password-gate">(function(){var key='gns-site-unlocked';function unlock(){document.documentElement.classList.remove('gns-locked');var el=document.getElementById('gns-permanent-notice');if(el)el.remove();}if(sessionStorage.getItem(key)==='yes'){unlock();return;}document.documentElement.classList.add('gns-locked');document.getElementById('gns-until').addEventListener('click',function(){document.getElementById('gns-message').hidden=true;document.getElementById('gns-signin').hidden=false;document.getElementById('gns-password-input').focus();});document.getElementById('gns-password-form').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('gns-password-input').value==='password123'){sessionStorage.setItem(key,'yes');unlock();}else{document.getElementById('gns-error').textContent='Incorrect password. Please try again.';}});})();</script></body></html>
