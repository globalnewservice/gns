<style>
  :root {
    --brand: #8e1c13;
    --brand-dark: #6d140d;
    --bg: #ffffff;
    --ink: #111111;
    --muted: #5f5f5f;
    --rule: #e2e2e2;
    --soft: #f4f4f4;
    --kicker: #8e1c13;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--brand);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --ink: #f2f2f2; --muted: #a8a8a8; --rule: #333; --soft: #1e1e1e; --kicker: #ff6b5e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --ink: #f2f2f2; --muted: #a8a8a8; --rule: #333; --soft: #1e1e1e; --kicker: #ff6b5e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Fira Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; }

  /* Masthead */
  .masthead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: #fff; }
  .bar { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 28px; }
  .logo { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; flex: none; }
  .logo-word { font-weight: 800; font-size: 26px; letter-spacing: 0.02em; }
  .logo svg { margin-top: 4px; }
  .nav { display: none; gap: 22px; flex: 1; }
  .nav a { font-weight: 600; font-size: 16px; padding: 6px 0; border-bottom: 2px solid transparent; }
  .nav a.active, .nav a:hover { border-bottom-color: #fff; }
  .icons { display: flex; gap: 16px; align-items: center; margin-left: auto; }
  .icon-btn { background: none; border: 0; padding: 6px; color: inherit; cursor: pointer; border-radius: 6px; }
  .icon-btn:focus-visible, a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  @media (min-width: 900px) { .nav { display: flex; } }

  .search, .drawer { display: none; }
  .search.open, .drawer.open { display: block; }
  .search { max-width: 1200px; margin: 0 auto; padding: 0 20px 14px; }
  .search input { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border: 0; border-radius: 6px; }
  .results { margin-top: 8px; }
  .results a, .results p { display: block; color: #fff; padding: 8px 0; font-size: 16px; margin: 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .drawer { border-top: 1px solid rgba(255,255,255,0.25); }
  .drawer ul { list-style: none; margin: 0 auto; padding: 8px 20px 16px; max-width: 1200px; }
  .drawer a { display: block; padding: 11px 0; font-weight: 600; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .drawer li:last-child a { border-bottom: 0; }

  /* Sub-bar */
  .strip { background: var(--brand-dark); color: #fff; overflow-x: auto; }
  .strip-inner { max-width: 1200px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 20px; white-space: nowrap; font-size: 14px; font-weight: 500; }
  .strip a { opacity: 0.9; }
  .strip a.active { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
  @media (min-width: 900px) { .strip { display: none; } }

  main { background: var(--bg); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 56px; }

  /* Home */
  .kicker { color: var(--kicker); font-weight: 700; font-size: 13px; margin-bottom: 6px; display: block; }
  .home-grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
  .lead { order: 1; }
  .rail-left { order: 2; }
  .rail-right { order: 3; }
  @media (min-width: 900px) {
    .home-grid { grid-template-columns: 240px 1fr 280px; }
    .rail-left { order: 1; } .lead { order: 2; } .rail-right { order: 3; }
  }
  .lead-img { aspect-ratio: 16 / 9; overflow: hidden; background: var(--soft); }
  .lead-img img { width: 100%; height: 100%; object-fit: cover; }
  .lead h2 {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-weight: 800; font-size: clamp(30px, 6vw, 48px); line-height: 1.04;
    margin: 14px 0 10px; text-transform: uppercase;
  }
  .lead h2 a:hover { text-decoration: underline; text-decoration-thickness: 3px; }
  .dek { overflow-wrap: anywhere; font-size: 18px; line-height: 1.45; color: var(--muted); margin: 0; max-width: 60ch; }

  .rail h3 {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-size: 20px; font-weight: 800; margin: 0 0 10px; padding-bottom: 8px;
    border-bottom: 3px solid var(--brand);
  }
  .story { display: grid; grid-template-columns: 1fr 104px; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .story.noimg { grid-template-columns: 1fr; }
  .story .thumb { aspect-ratio: 4 / 3; overflow: hidden; background: var(--soft); }
  .story .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .story h4 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 700; }
  .story:hover h4 { text-decoration: underline; }

  .more { margin-top: 36px; }
  .more h3 {
    font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif;
    font-size: 24px; font-weight: 800; margin: 0 0 6px; padding-bottom: 8px; border-bottom: 3px solid var(--brand);
  }
  .card-grid { display: grid; gap: 22px; grid-template-columns: 1fr; margin-top: 16px; }
  @media (min-width: 640px) { .card-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
  .card .thumb { aspect-ratio: 16 / 9; overflow: hidden; background: var(--soft); margin-bottom: 10px; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card h4 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; }
  .card:hover h4 { text-decoration: underline; }

  /* Section page & Article styles */
  .section-title { font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif; font-weight: 800; font-size: clamp(32px, 6vw, 52px); margin: 4px 0 4px; }
  .section-rule { border: 0; border-top: 4px solid var(--brand); margin: 0 0 8px; }
  .list .story { grid-template-columns: 1fr 140px; }
  @media (min-width: 640px) { .list .story { grid-template-columns: 1fr 220px; } .list .story h4 { font-size: 22px; } }

  .article { max-width: 1000px; margin: 0 auto; padding: 24px 20px 56px; }
  .article h1 { margin: 0 0 22px; font-weight: 700; text-transform: uppercase; font-size: clamp(28px, 6.2vw, 58px); line-height: 1.05; text-align: center; }
  .article .photo { width: 100%; aspect-ratio: 1899 / 721; overflow: hidden; background: var(--soft); }
  .article .photo img { width: 100%; height: 100%; object-fit: cover; }
  .art-dek { text-align: center; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.4; color: var(--muted); margin: -8px auto 22px; max-width: 60ch; }
  .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .meta p { margin: 0; }
  .body { margin-top: 18px; overflow-wrap: anywhere; }
  .body p { font-size: 19px; line-height: 1.5; margin: 0 0 1em; max-width: 75ch; }
  .body .subhead { font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif; font-weight: 800; font-size: clamp(24px, 3.4vw, 30px); line-height: 1.15; margin: 1.5em 0 0.5em; max-width: 75ch; }
  .body blockquote { margin: 1.2em 0 1.4em; padding: 4px 0 4px 20px; border-left: 5px solid var(--brand); max-width: 75ch; }
  .body blockquote p { font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif; font-weight: 700; font-size: clamp(22px, 3vw, 28px); line-height: 1.25; margin: 0; }
  .back { display: inline-block; margin-top: 18px; font-weight: 600; color: var(--kicker); }

  footer { background: var(--brand); color: #fff; }
  footer .wrap { padding: 22px 20px; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>
</head>

/* ===== DOM Wiring ===== */
const appEl = document.getElementById("app");
const navEl = document.getElementById("nav");
const drawerListEl = document.getElementById("drawerList");
const stripEl = document.getElementById("strip");
const searchBtn = document.getElementById("searchBtn");
const menuBtn = document.getElementById("menuBtn");
const searchDiv = document.getElementById("search");
const searchInput = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");
const drawerDiv = document.getElementById("drawer");

function init() {
  SECTIONS.forEach(s => {
    const a = document.createElement("a");
    a.href = `#/${s.id === 'home' ? '' : s.id}`;
    a.textContent = s.label;
    a.dataset.section = s.id;
    navEl.appendChild(a);

    const sa = document.createElement("a");
    sa.href = `#/${s.id === 'home' ? '' : s.id}`;
    sa.textContent = s.label;
    sa.dataset.section = s.id;
    stripEl.appendChild(sa);

    const li = document.createElement("li");
    const da = document.createElement("a");
    da.href = `#/${s.id === 'home' ? '' : s.id}`;
    da.textContent = s.label;
    da.addEventListener("click", () => toggleDrawer(false));
    li.appendChild(da);
    drawerListEl.appendChild(li);
  });

  searchBtn.addEventListener("click", () => {
    const isOpen = searchDiv.classList.toggle("open");
    searchBtn.setAttribute("aria-expanded", isOpen);
    if (isOpen) {
      drawerDiv.classList.remove("open");
      menuBtn.setAttribute("aria-expanded", "false");
      searchInput.focus();
    }
  });

  menuBtn.addEventListener("click", () => {
    const isOpen = drawerDiv.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", isOpen);
    if (isOpen) {
      searchDiv.classList.remove("open");
      searchBtn.setAttribute("aria-expanded", "false");
    }
  });

  searchInput.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      resultsDiv.innerHTML = "";
      return;
    }
    const matches = [];
    Object.keys(DB).forEach(sec => {
      const data = DB[sec];
      if (data.lead && data.lead.title.toLowerCase().includes(q)) matches.push({ title: data.lead.title, link: data.lead.link });
      if (data.railLeft) data.railLeft.forEach(i => { if (i.title.toLowerCase().includes(q)) matches.push(i); });
      if (data.railRight) data.railRight.forEach(i => { if (i.title.toLowerCase().includes(q)) matches.push(i); });
      if (data.more) data.more.forEach(i => { if (i.title.toLowerCase().includes(q)) matches.push(i); });
      if (data.stories) data.stories.forEach(i => { if (i.title.toLowerCase().includes(q)) matches.push(i); });
      if (data.items) data.items.forEach(i => { if (i.title.toLowerCase().includes(q)) matches.push(i); });
    });

    if (matches.length === 0) {
      resultsDiv.innerHTML = `<p>No results found for "${escapeHtml(q)}"</p>`;
    } else {
      resultsDiv.innerHTML = matches.map(m => `<a href="${m.link}">${escapeHtml(m.title)}</a>`).join("");
    }
  });

  window.addEventListener("hashchange", router);
  router();
}

function toggleDrawer(open) {
  drawerDiv.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", open);
}

function router() {
  const hash = location.hash || "#/";
  searchDiv.classList.remove("open");
  drawerDiv.classList.remove("open");
  searchBtn.setAttribute("aria-expanded", "false");
  menuBtn.setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);

  let activeSec = "home";
  if (hash.startsWith("#/politics")) activeSec = "politics";
  else if (hash.startsWith("#/world")) activeSec = "world";
  else if (hash.startsWith("#/tech")) activeSec = "tech";
  else if (hash.startsWith("#/business")) activeSec = "business";
  else if (hash.startsWith("#/opinion")) activeSec = "opinion";
  else if (hash.startsWith("#/cartoons")) activeSec = "cartoons";
  else if (hash.startsWith("#/article/") || hash.startsWith("#/cartoon/")) activeSec = "";

  document.querySelectorAll(".nav a, .strip-inner a").forEach(a => {
    if (a.dataset.section === activeSec) a.classList.add("active");
    else a.classList.remove("active");
  });

  if (hash === "#/" || hash === "") {
    renderHome();
  } else if (hash.startsWith("#/article/")) {
    const artId = hash.replace("#/article/", "");
    renderArticle(artId);
  } else if (hash.startsWith("#/cartoon/")) {
    const toonId = hash.replace("#/cartoon/", "");
    renderCartoonDetail(toonId);
  } else {
    const sec = hash.replace("#/", "");
    if (DB[sec]) {
      renderSection(sec);
    } else {
      renderHome();
    }
  }
}

function renderHome() {

              </div>
            </div>
          `).join("")}
        </div>

        <div class="lead">
          <div class="lead-img"><img src="${d.lead.img}" alt="" loading="lazy"></div>
          <span class="kicker">${escapeHtml(d.lead.tag)} &bull; ${escapeHtml(d.lead.time)}</span>
          <h2><a href="${d.lead.link}">${escapeHtml(d.lead.title)}</a></h2>
          <p class="dek">${escapeHtml(d.lead.dek)}</p>
        </div>

        <div class="rail rail-right">
          <h3>Opinion & Markets</h3>
          ${d.railRight.map(s => `

              <div>
                <span class="kicker">${s.time}</span>
                <h4><a href="${s.link}">${escapeHtml(s.title)}</a></h4>
              </div>
              ${s.img ? `<div class="thumb"><img src="${s.img}" alt="" loading="lazy"></div>` : ''}
            </div>
          `).join("")}
        </div>
      </div>

      <div class="more">
        <h3>Featured Coverage</h3>
        <div class="card-grid">
          ${d.more.map(c => `
            <article class="card">
              <div class="thumb"><img src="${c.img}" alt="" loading="lazy"></div>
              <h4><a href="${c.link}">${escapeHtml(c.title)}</a></h4>
            </article>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}

function renderSection(secKey) {
  const data = DB[secKey];
  if (!data) return renderHome();

  if (secKey === "cartoons") {
    appEl.innerHTML = `
      <div class="wrap">
        <h1 class="section-title">${escapeHtml(data.title)}</h1>
        <hr class="section-rule">
        <div class="toon-grid four">
          ${data.items.map(item => `
            <a class="toon-card" href="${item.link}">
              <div class="frame"><img src="${item.img}" alt="" loading="lazy"></div>
              <h4>${escapeHtml(item.title)}</h4>
              <p>${escapeHtml(item.desc)}</p>
            </a>
          `).join("")}
        </div>
      </div>
    `;
    return;
  }

  appEl.innerHTML = `
    <div class="wrap">
      <h1 class="section-title">${escapeHtml(data.title)}</h1>
      <hr class="section-rule">
      <div class="list">
        ${data.stories.map(s => `
          <div class="story">
            <div>
              <span class="kicker">${escapeHtml(s.time)}</span>
              <h4><a href="${s.link}">${escapeHtml(s.title)}</a></h4>
              <p class="dek" style="font-size:15px; margin-top:6px;">${escapeHtml(s.dek)}</p>
            </div>
            <div class="thumb"><img src="${s.img}" alt="" loading="lazy"></div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderArticle(artId) {
  const art = ARTICLES[artId] || {
    title: "Global Summit Reaches Landmark Accord After Intensive Final Session",
    dek: "Delegates finalize landmark international framework after hours of deliberation.",
    tag: "Breaking News",
    time: "October 18, 2026",
    author: "GNS Staff",
    photo: IMAGES.nr_1zmcpwjo5taz32o5pqvp,
    content: [
      "GENEVA — International delegates concluded weeks of rigorous diplomatic negotiations early Sunday morning, ratifying a comprehensive new pact designed to reshape multilateral cooperation across key economic and environmental sectors.",
      "The agreement establishes stringent benchmarks and structured accountability protocols, hailed by participating heads of state as a triumph of collaborative governance over geopolitical fragmentation.",
      "Subhead: Looking Ahead",
      "Implementation committees will convene next month in Vienna to draft regulatory enforcement mechanisms and establish regional oversight bureaus. Observers note that while the framework is robust, its long-term success will hinge upon sustained domestic political will across participating nations."
    ]
  };

  appEl.innerHTML = `
    <article class="article">
      <span class="kicker" style="text-align:center;">${escapeHtml(art.tag)}</span>
      <h1>${escapeHtml(art.title)}</h1>
      <p class="art-dek">${escapeHtml(art.dek)}</p>
      
      <div class="photo"><img src="${art.photo}" alt="" loading="lazy"></div>
      
      <div class="meta">
        <p>By <strong>${escapeHtml(art.author)}</strong></p>
        <p class="tag">${escapeHtml(art.time)}</p>
      </div>
      
      <div class="body">
        ${art.content.map(block => {
          if (typeof block === 'string') {
            if (block.startsWith("Subhead:")) {
              return `<div class="subhead">${escapeHtml(block.replace("Subhead:", "").trim())}</div>`;
            }
            return `<p>${escapeHtml(block)}</p>`;
          } else if (block.type === 'quote') {
            return `<blockquote><p>${escapeHtml(block.text)}</p></blockquote>`;
          }
          return '';
        }).join("")}
      </div>
      
      <a class="back" href="#/">&larr; Back to Home</a>
    </article>
  `;
}

function renderCartoonDetail(toonId) {
  const toon = CARTOONS_DETAIL[toonId] || {
    title: "Editorial Cartoon",
    caption: "“Another day, another paradigm shift.”",
    img: IMAGES.nr_1zmcpwjo5taz32o5pqvp
  };

  appEl.innerHTML = `
    <div class="article">
      <div class="band-head" style="margin-bottom:18px;">
        <h3>Editorial Cartoons</h3>
        <a href="#/cartoons">&larr; All Cartoons</a>
      </div>
      <h1 style="font-size: clamp(24px, 4vw, 40px);">${escapeHtml(toon.title)}</h1>
      
      <div class="toon-full"><img src="${toon.img}" alt="" loading="lazy"></div>
      <p class="toon-caption">${escapeHtml(toon.caption)}</p>
    </div>
  `;
}

function escapeHtml(str) {
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  }[tag] || tag));
}
