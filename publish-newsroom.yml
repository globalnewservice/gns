name: Publish approved newsroom stories

on:
  schedule:
    # GitHub scheduled workflows run on the default branch; publishing is automatic.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-newsroom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: gns-newsroom
      # Store this as a GitHub Actions repository variable named FIREBASE_API_KEY.
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add approved stories and cartoons to the site
        id: add
        run: python scripts/publish_from_newsroom.py add

      - name: Commit and push
        if: steps.add.outputs.changed == '1'
        run: |
          git config user.name "GNS Newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add index.html
          git commit -m "Publish approved newsroom stories and cartoons"
          git push

      - name: Mark submissions live in the newsroom
        if: steps.add.outputs.count != '0'
        run: python scripts/publish_from_newsroom.py mark
