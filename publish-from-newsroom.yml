name: Publish approved newsroom stories

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-newsroom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: gns-newsroom
      FIREBASE_API_KEY: AIzaSyBnRHcu7Uueo3ebyR-89XA8WXLEDrJqIuQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add approved stories to the site
        id: add
        run: python scripts/publish_from_newsroom.py add

      - name: Commit and push
        if: steps.add.outputs.changed == '1'
        run: |
          git config user.name "GNS Newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add index.html
          git commit -m "Publish approved newsroom stories"
          git push

      - name: Mark stories live in the newsroom
        if: steps.add.outputs.count != '0'
        run: python scripts/publish_from_newsroom.py mark
