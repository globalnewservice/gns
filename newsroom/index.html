<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GNS Newsroom (Copy)</title>
<meta name="description" content="GNS staff portal: write stories, add a cover image and byline, and send them to management for approval.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Sans+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: GNS crimson masthead over a calm working desk; a story form with a sidebar, a review queue of cards, and a preview that looks like the published article. */
  :root {
    --brand: #8e1c13; --brand-deep: #6d140d; --on-brand: #ffffff;
    --bg: #f5f3f1; --surface: #ffffff; --sunk: #efebe8; --ink: #1b1716; --muted: #685f5b; --line: #e2dcd8;
    --accent: #8e1c13; --focus: #8e1c13;
    --pending: #2f5597; --pending-bg: #e8eef9; --ok: #1d7347; --ok-bg: #e4f3ea; --warn: #8a5a00; --warn-bg: #fbf0d9;
    --live: #5b2a86; --live-bg: #f0e8f7; --bad: #a3271b;
    --font: "Fira Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --display: "Fira Sans Condensed", "Fira Sans", "Arial Narrow", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141211; --surface: #1e1b1a; --sunk: #191615; --ink: #f2eeec; --muted: #a79f9b; --line: #352f2d;
      --accent: #ff8273; --focus: #ff8273;
      --pending: #9bb8f3; --pending-bg: #1d2638; --ok: #6fd39d; --ok-bg: #16291f; --warn: #e8bd62; --warn-bg: #2c2414;
      --live: #c9a4ee; --live-bg: #2a1f35; --bad: #ff8a7a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141211; --surface: #1e1b1a; --sunk: #191615; --ink: #f2eeec; --muted: #a79f9b; --line: #352f2d;
    --accent: #ff8273; --focus: #ff8273;
    --pending: #9bb8f3; --pending-bg: #1d2638; --ok: #6fd39d; --ok-bg: #16291f; --warn: #e8bd62; --warn-bg: #2c2414;
    --live: #c9a4ee; --live-bg: #2a1f35; --bad: #ff8a7a; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; }

  /* Masthead */
  .mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); color: var(--on-brand); }
  .mast-in { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
  .logo { display: inline-flex; align-items: baseline; gap: 10px; color: inherit; text-decoration: none; }
  .logo b { font-weight: 800; font-size: 26px; letter-spacing: 0.02em; line-height: 1; }
  .logo span { font-weight: 500; font-size: 16px; opacity: 0.9; border-left: 1px solid rgba(255,255,255,0.45); padding-left: 10px; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .who-text { text-align: right; line-height: 1.2; min-width: 0; }
  .who-text strong { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-text small { font-size: 13px; opacity: 0.85; }
  .btn-ghost-light { background: transparent; border: 1px solid rgba(255,255,255,0.6); color: #fff; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-ghost-light:hover { background: rgba(255,255,255,0.12); }
  .tabs { background: var(--brand-deep); }
  .tabs-in { max-width: 1120px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { background: none; border: 0; color: rgba(255,255,255,0.82); padding: 11px 12px; font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
  .tabs button[aria-current="page"] { color: #fff; border-bottom-color: #fff; }
  .count { background: #fff; color: var(--brand); border-radius: 999px; font-size: 12px; font-weight: 800; padding: 1px 7px; font-variant-numeric: tabular-nums; }

  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  .page-title { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4.5vw, 40px); margin: 0 0 4px; line-height: 1.05; }
  .lede { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }

  /* Cards, fields, buttons */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .field { display: grid; gap: 6px; }
  .field > label, .label { font-weight: 700; font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 16px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
  textarea { resize: vertical; line-height: 1.55; }
  .btn { border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 15px; border: 1px solid var(--line); background: var(--surface); }
  .btn:hover { background: var(--sunk); }
  .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-deep); }
  .btn-ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .msg { border-radius: 8px; padding: 12px 14px; font-size: 15px; margin: 0 0 16px; }
  .msg-ok { background: var(--ok-bg); color: var(--ok); }
  .msg-warn { background: var(--warn-bg); color: var(--warn); }
  .msg-info { background: var(--pending-bg); color: var(--pending); }
  .msg strong { color: inherit; }

  /* Sign-in */
  .signin-wrap { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 32px 16px; }
  .signin { width: 100%; max-width: 420px; padding: 28px 24px; display: grid; gap: 16px; }
  .signin h1 { margin: 0; font-family: var(--display); font-size: 32px; line-height: 1.05; }
  .signin p { margin: 0; }
  .err { color: var(--bad); font-size: 14px; font-weight: 600; margin: 0; }

  /* Write */
  .write { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .write { grid-template-columns: minmax(0, 1fr) 330px; align-items: start; } }
  .write-main { padding: 20px; display: grid; gap: 16px; }
  .write-side { display: grid; gap: 16px; }
  .side-box { padding: 16px; display: grid; gap: 10px; }
  #f-headline { font-family: var(--display); font-size: 24px; font-weight: 800; }
  #f-body { min-height: 380px; font-size: 17px; }
  .meta-row { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
  .two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .picker-search { margin-bottom: 2px; }
  .picker { max-height: 236px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
  .picker label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .picker label:last-child { border-bottom: 0; }
  .picker label:has(input:checked) { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
  .picker input { accent-color: var(--brand); width: 18px; height: 18px; margin: 0; }
  .picker .pn { font-weight: 600; font-size: 15px; display: block; }
  .picker .pt { color: var(--muted); font-size: 13px; display: block; }
  .picker .none { padding: 12px; color: var(--muted); font-size: 14px; }
  .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center; color: var(--muted); font-size: 14px; display: grid; gap: 8px; place-items: center; }
  .drop.over { border-color: var(--accent); color: var(--ink); }
  .cover-prev { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: var(--sunk); }
  .cover-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-prev button { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .send-row { display: grid; gap: 8px; }

  /* Lists */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filters .n { font-variant-numeric: tabular-nums; opacity: 0.75; }
  .list { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 16px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .item:hover { border-color: var(--muted); }
  .item h3 { margin: 0; font-size: 18px; line-height: 1.25; min-width: 0; }
  .item .sub { grid-column: 1 / 2; color: var(--muted); font-size: 14px; }
  .item .chip { grid-row: 1; grid-column: 2; align-self: start; }
  .item .note { grid-column: 1 / -1; font-size: 14px; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; margin-top: 6px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.pending { background: var(--pending-bg); color: var(--pending); }
  .chip.approved { background: var(--ok-bg); color: var(--ok); }
  .chip.returned { background: var(--warn-bg); color: var(--warn); }
  .chip.published { background: var(--live-bg); color: var(--live); }
  .empty { padding: 28px 20px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

  /* Accounts */
  .acct-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .acct-grid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 13px; color: var(--muted); font-weight: 700; }
  td .small { color: var(--muted); font-size: 13px; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 14px; padding: 4px 0; margin-right: 12px; }
  .role { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); }
  .role.mgmt { background: var(--brand); color: #fff; border-color: var(--brand); }
  .inactive td { opacity: 0.55; }
  .pw-row { display: flex; gap: 8px; }
  .pw-row input { flex: 1; min-width: 0; }

  /* Preview dialog */
  .dialog { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.55); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 40px; }
  .dialog-card { max-width: 860px; margin: 0 auto; background: var(--surface); border-radius: 12px; overflow: hidden; }
  .dialog-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .dialog-bar .meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  .art { padding: 24px clamp(16px, 4vw, 44px) 32px; }
  .art .kicker { color: var(--accent); font-weight: 700; font-size: 13px; text-align: center; margin: 0 0 8px; }
  .art h1 { margin: 0 0 12px; text-align: center; text-transform: uppercase; font-weight: 700; font-size: clamp(26px, 4.6vw, 44px); line-height: 1.06; }
  .art .dek { text-align: center; color: var(--muted); font-size: 18px; margin: 0 auto 18px; max-width: 60ch; }
  .art .cover { aspect-ratio: 16 / 9; max-width: 100%; background: var(--sunk); border-radius: 4px; overflow: hidden; }
  .art .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .credit { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .art .byline { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; margin: 14px 0 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .art .body p { font-size: 18px; line-height: 1.6; margin: 0 0 1em; max-width: 70ch; }
  .art .body h2 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 1.4em 0 0.4em; }
  .art .body blockquote { margin: 1em 0; padding-left: 16px; border-left: 4px solid var(--brand); font-family: var(--display); font-weight: 700; font-size: 22px; }
  .review { border-top: 1px solid var(--line); padding: 18px clamp(16px, 4vw, 44px) 24px; background: var(--sunk); display: grid; gap: 12px; }
  .review h2 { margin: 0; font-size: 18px; }
  .review .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  @media (max-width: 560px) {
    .logo span { display: none; }
    .two { grid-template-columns: 1fr; }
    .who-text small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Draft preview: a copy of the main GNS site's article page */
  .preview-btn-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .pv-note { background: var(--pending-bg); color: var(--pending); font-size: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .pv-note strong { color: inherit; }
  .gp { --gp-brand: #8e1c13; --gp-bg: #ffffff; --gp-ink: #111111; --gp-muted: #5f5f5f; --gp-rule: #e2e2e2; --gp-soft: #f4f4f4; --gp-kicker: #8e1c13;
        background: var(--gp-bg); color: var(--gp-ink); font-family: "Fira Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .gp { --gp-bg: #141414; --gp-ink: #f2f2f2; --gp-muted: #a8a8a8; --gp-rule: #333; --gp-soft: #1e1e1e; --gp-kicker: #ff6b5e; }
  }
  :root[data-theme="dark"] .gp { --gp-bg: #141414; --gp-ink: #f2f2f2; --gp-muted: #a8a8a8; --gp-rule: #333; --gp-soft: #1e1e1e; --gp-kicker: #ff6b5e; }
  .gp-mast { background: var(--gp-brand); color: #fff; }
  .gp-bar { padding: 12px 20px; display: flex; align-items: center; gap: 24px; }
  .gp-logo { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; flex: none; }
  .gp-logo b { font-weight: 800; font-size: 26px; letter-spacing: 0.02em; }
  .gp-logo svg { margin-top: 4px; }
  .gp-nav { display: none; gap: 20px; flex: 1; font-weight: 600; font-size: 15px; }
  .gp-nav span { padding: 6px 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  .gp-nav span.on { border-bottom-color: #fff; }
  @media (min-width: 760px) { .gp-nav { display: flex; } }
  .gp-article { max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; }
  .gp-article h1 { margin: 0 0 22px; font-weight: 700; text-transform: uppercase; font-size: clamp(26px, 5.4vw, 52px); line-height: 1.05; text-align: center; text-wrap: balance; }
  .gp-article h1.ph, .gp-body .ph { color: var(--gp-muted); font-style: italic; }
  .gp-dek { text-align: center; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.4; color: var(--gp-muted); margin: -8px auto 22px; max-width: 60ch; }
  .gp-photo { width: 100%; aspect-ratio: 1899 / 721; overflow: hidden; background: var(--gp-soft); }
  .gp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gp-credit { color: var(--gp-muted); font-size: 13px; margin: 6px 0 0; }
  .gp-meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; color: var(--gp-muted); font-size: 15px; line-height: 1.45; }
  .gp-meta p { margin: 0; }
  .gp-tag { white-space: nowrap; }
  .gp-body { margin-top: 18px; }
  .gp-body p { font-size: 19px; line-height: 1.5; margin: 0 0 1em; max-width: 75ch; }
  .gp-body .gp-sub { font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif; font-weight: 800; font-size: clamp(24px, 3.4vw, 30px); line-height: 1.15; margin: 1.5em 0 0.5em; max-width: 75ch; }
  .gp-body blockquote { margin: 1.2em 0 1.4em; padding: 4px 0 4px 20px; border-left: 5px solid var(--gp-brand); max-width: 75ch; }
  .gp-body blockquote p { font-family: "Fira Sans Condensed", "Fira Sans", Arial, sans-serif; font-weight: 700; font-size: clamp(22px, 3vw, 28px); line-height: 1.25; margin: 0 0 0.35em; }
  .gp-body blockquote p:last-child { margin-bottom: 0; }
  @media (min-width: 700px) { .gp-body p { font-size: 21px; } .gp-meta { font-size: 16px; } }
  .gp-back { display: inline-block; margin-top: 18px; font-weight: 600; color: var(--gp-kicker); }
  .gp-foot { background: var(--gp-brand); color: #fff; padding: 18px 20px; font-size: 14px; }
  .gp-toon { margin: 0; background: var(--gp-soft); border: 1px solid var(--gp-rule); min-height: 160px; display: grid; place-items: center; }
  .gp-toon img { width: 100%; height: auto; display: block; max-height: 85vh; object-fit: contain; }
  .gp-toon .ph { color: var(--gp-muted); font-style: italic; padding: 40px 16px; }
  .gp-caption { font-size: clamp(19px, 2.4vw, 22px); line-height: 1.45; text-align: center; font-style: italic; margin: 18px auto 0; max-width: 60ch; overflow-wrap: anywhere; }
  .gp-caption.ph { color: var(--gp-muted); }
  .art .cover.toon { aspect-ratio: auto; border: 1px solid var(--line); }
  .art .cover.toon img { height: auto; max-height: 80vh; object-fit: contain; }
  .art .toon-caption { text-align: center; font-style: italic; font-size: 19px; margin: 14px auto 0; max-width: 60ch; }
  .toon-drop { min-height: 180px; }
  .toon-prev { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sunk); }
  .toon-prev img { width: 100%; height: auto; max-height: 520px; object-fit: contain; display: block; }
  .toon-prev button { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  /* Editorial board */
  .board { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .board { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
  .item:disabled { opacity: 0.6; cursor: default; }
  .chip.open { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
  .chip.claimed { background: var(--pending-bg); color: var(--pending); }
  .chip.sent { background: var(--live-bg); color: var(--live); }
  .checks { border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); }
  .checks label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  .checks label:last-child { border-bottom: 0; }
  .checks label:has(input:checked) { background: var(--surface); color: var(--muted); text-decoration: line-through; }
  .checks input { accent-color: var(--brand); width: 18px; height: 18px; margin: 2px 0 0; }
  .fixed-meta { display: grid; gap: 4px; font-size: 14px; }
  .fixed-meta span { color: var(--muted); }
  .tips { display: grid; }
  .tip { font-size: 14px; border-top: 1px solid var(--line); padding: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tip small { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 2px; white-space: normal; }
  .tip .linkbtn { font-size: 12px; margin: 0; padding: 0; }
</style>

<header class="mast">
  <div class="mast-in">
    <a class="logo" href="#top" aria-label="GNS Newsroom"><b>GNS</b><span>Newsroom</span></a>
    <div class="who" id="who" hidden>
      <div class="who-text"><strong id="who-name"></strong><small id="who-title"></small></div>
      <button type="button" class="btn-ghost-light" id="signout">Sign out</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Newsroom sections" hidden><div class="tabs-in" id="tabs-in"></div></nav>
</header>

<!-- Sign in -->
<section id="v-signin" class="signin-wrap">
  <form class="card signin" id="signin-form" novalidate>
    <h1>Staff sign in</h1>
    <p class="hint">Write stories and send them to management for approval before they run on GNS.</p>
    <div class="field"><label for="si-user">Username</label><input type="text" id="si-user" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="si-pass">Password</label><input type="password" id="si-pass" autocomplete="current-password"></div>
    <p class="err" id="si-err" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary" id="si-btn">Sign in</button>
    <p class="hint" id="si-status">Connecting to the newsroom…</p>
  </form>
</section>

<main id="v-app" hidden></main>

<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="dialog-card" id="dialog-card"></div>
</div>

<script>
/* ============ constants ============ */
const SECTIONS = ["U.S.", "Politics", "Global Affairs", "Elections", "Business", "Opinion"];
const STATUS = { pending: "Waiting for review", approved: "Approved, queued for GNS", returned: "Sent back", published: "Live on GNS" };
const SALT = "gns-newsroom|";
const SESSION_KEY = "gns-newsroom-session";
const COVER_BUDGET = 190000;   // chars of data URL; db documents max out at 256 KiB

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = iso => { try { return new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) + " ET"; } catch (e) { return iso || ""; } };
const words = s => (String(s).trim().match(/\S+/g) || []).length;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

function sha256Fallback(bytes) {
  const K = [], H = [], frac = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2, c = 0; c < 64; n++) { let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; } if (p) { if (c < 8) H[c] = frac(Math.sqrt(n)); K[c] = frac(Math.cbrt(n)); c++; } }
  const len = bytes.length, buf = new Uint8Array(((len + 9 + 63) >> 6) << 6); buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer); dv.setUint32(buf.length - 4, (len * 8) >>> 0); dv.setUint32(buf.length - 8, Math.floor(len / 536870912));
  const W = new Int32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < buf.length; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) { const a = W[i - 15], b = W[i - 2]; W[i] = (W[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + W[i - 7] + (r(b, 17) ^ r(b, 19) ^ (b >>> 10))) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0; const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  try { if (window.crypto && crypto.subtle) { const d = await crypto.subtle.digest("SHA-256", bytes); return Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, "0")).join(""); } } catch (e) {}
  return sha256Fallback(bytes);
}
const hashFor = (u, p) => sha256(SALT + u.trim().toLowerCase() + "|" + p);

function bodyHtml(text) {
  const blocks = String(text).replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => {
    if (b.startsWith("## ")) return `<h2>${esc(b.slice(3))}</h2>`;
    if (b.startsWith("> ")) return `<blockquote>${esc(b.replace(/^> ?/gm, ""))}</blockquote>`;
    return `<p>${esc(b).replace(/\n/g, "<br>")}</p>`;
  }).join("");
}
function errText(e) {
  const code = e && e.code;
  if (code === "invalid_argument") return "Claude didn't let this account save to the newsroom. Ask management to invite you to this page as an Editor.";
  if (code === "quota_exceeded") return "The newsroom's storage is full. Ask management to clear out old stories.";
  if (code === "revoked") return "Your access to this page changed. Reload the page.";
  return "That didn't go through. Check your connection and try again.";
}

/* ============ state ============ */
const S = { db: null, userCap: null, canWrite: null, accounts: {}, accountsReady: false, me: null, subs: [], view: "write", filter: "pending",
            unsubSubs: null, batch: null, eds: [], tips: [], tipDraft: "", unsubBoard: [], unsubEds: null, edOpen: null, cover: null, coverKept: false, editingId: null, openId: null, flash: null };

/* ============ boot ============ */
(async function boot() {
  const C = window.claude;
  const db = C && C.use ? await C.use("db") : null;
  S.db = db;
  if (!db) {
    $("si-status").textContent = "The newsroom can't connect. Make sure you're signed in to Claude and that management has shared this page with you.";
    $("si-btn").disabled = true;
    return;
  }
  S.userCap = C.use ? await C.use("user") : null;
  db.collection("accounts").onSnapshot(snap => {
    const map = {};
    snap.docs.forEach(d => { if (d.exists) map[d.id] = { id: d.id, ...d.data() }; });
    S.accounts = map; S.accountsReady = true;
    $("si-status").textContent = Object.keys(map).length ? "" : "No accounts exist yet. Management sets them up.";
    if (S.me) {
      const fresh = map[S.me.id];
      if (!fresh || fresh.active === false || fresh.hash !== S.me.hash) return signOut("Your account was changed by management. Sign in again.");
      S.me = fresh; renderChrome(); if (!isTyping()) render();
      else refreshPicker();
    } else {
      const sess = store.get(SESSION_KEY);
      if (sess && map[sess.u] && map[sess.u].active !== false && map[sess.u].hash === sess.h) enter(map[sess.u]);
    }
  }, e => { $("si-status").textContent = errText(e); });
})();

/* ============ sign in / out ============ */
$("signin-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const u = $("si-user").value.replace(/\s+/g, ""), p = $("si-pass").value;   // usernames never contain spaces
  const err = $("si-err"); err.hidden = true;
  if (!u || !p) { err.textContent = "Enter your username and password."; err.hidden = false; return; }
  if (!S.accountsReady) { err.textContent = "Still connecting. Try again in a moment."; err.hidden = false; return; }
  const acct = S.accounts[u.toLowerCase()];
  let h = await hashFor(u, p);
  if (acct && acct.hash !== h && p.trim() !== p) h = await hashFor(u, p.trim());   // a space pasted in with the password
  if (!acct || acct.hash !== h) { err.textContent = "That username and password don't match a GNS account."; err.hidden = false; $("si-pass").value = ""; return; }
  if (acct.active === false) { err.textContent = "This account has been deactivated. Talk to management."; err.hidden = false; return; }
  store.set(SESSION_KEY, { u: acct.id, h: acct.hash });
  enter(acct);
});
$("signout").addEventListener("click", () => signOut());

async function enter(acct) {
  S.me = acct; S.flash = null;
  S.view = isMgmt() ? "review" : "write";
  $("v-signin").hidden = true; $("v-app").hidden = false; $("who").hidden = false; $("tabs").hidden = false;
  if (S.userCap && S.userCap.can) { try { S.canWrite = await S.userCap.can("data.write"); } catch (e) { S.canWrite = null; } }
  subscribeSubs(); subscribeBoard();
  renderChrome(); render();
}
function signOut(message) {
  store.del(SESSION_KEY);
  if (S.unsubSubs) { S.unsubSubs(); S.unsubSubs = null; }
  unsubscribeBoard();
  Object.assign(S, { me: null, subs: [], batch: null, eds: [], tips: [], edOpen: null, cover: null, editingId: null, openId: null, flash: null, filter: "pending" });
  closeDialog();
  $("v-app").hidden = true; $("who").hidden = true; $("tabs").hidden = true; $("v-signin").hidden = false;
  $("si-pass").value = "";
  const err = $("si-err"); err.hidden = !message; err.textContent = message || "";
}
const isMgmt = () => S.me && S.me.role === "management";
const isForm = () => S.view === "write" || S.view === "cartoon";
const isTyping = () => isForm() || S.view === "edit";
const editingSub = () => S.editingId ? S.subs.find(s => s.id === S.editingId) || null : null;
const toonMode = () => { const e = editingSub(); return e ? e.kind === "cartoon" : S.view === "cartoon"; };
const draftKey = () => "gns-newsroom-draft-" + (toonMode() ? "toon-" : "") + S.me.id;

function subscribeSubs() {
  if (S.unsubSubs) S.unsubSubs();
  let q = S.db.collection("submissions");
  q = isMgmt() ? q.orderBy("submittedAt", "desc").limit(300) : q.where("submittedBy", "==", S.me.id).orderBy("submittedAt", "desc").limit(200);
  S.unsubSubs = q.onSnapshot(snap => {
    S.subs = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
    renderChrome();
    if (!isTyping()) render();
    if (S.openId) { const s = S.subs.find(x => x.id === S.openId); if (s) renderDialog(s); }
  }, e => { S.flash = { kind: "warn", text: errText(e) }; render(); });
}

/* ============ chrome ============ */
function renderChrome() {
  $("who-name").textContent = S.me.name; $("who-title").textContent = S.me.title || "";
  const mine = S.subs.filter(s => s.submittedBy === S.me.id);
  const pending = S.subs.filter(s => s.status === "pending").length;
  const boardN = S.batch && !S.batch.sentBy ? S.eds.length : 0;
  const tabs = isMgmt()
    ? [["review", "Review queue", pending], ["write", S.editingId && !toonMode() ? "Edit story" : "Write a story"], ["cartoon", S.editingId && toonMode() ? "Edit cartoon" : "Submit a cartoon"], ["board", "Syndicateds", boardN], ["mine", "My submissions", mine.length], ["accounts", "Staff accounts"]]
    : [["write", S.editingId && !toonMode() ? "Edit story" : "Write a story"], ["cartoon", S.editingId && toonMode() ? "Edit cartoon" : "Submit a cartoon"], ["board", "Syndicateds", boardN], ["mine", "My submissions", mine.length]];
  $("tabs-in").innerHTML = tabs.map(([id, label, n]) =>
    `<button type="button" data-view="${id}"${S.view === id || (id === "board" && S.view === "edit") ? ' aria-current="page"' : ""}>${esc(label)}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("");
}
$("tabs-in").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (!b) return;
  const next = b.dataset.view;
  if (S.editingId && (next === "write" || next === "cartoon") && (next === "cartoon") !== toonMode()) { S.editingId = null; S.cover = null; S.coverKept = false; }
  else if (!S.editingId && isForm() && (next === "write" || next === "cartoon") && next !== S.view) { S.cover = null; S.coverKept = false; }
  S.view = next; S.flash = null; renderChrome(); render(); window.scrollTo(0, 0); });

function render() {
  const v = S.view;
  $("v-app").innerHTML = isForm() ? viewWrite() : v === "board" ? viewBoard() : v === "edit" ? viewEditor() : v === "mine" ? viewMine() : v === "review" ? viewReview() : viewAccounts();
  if (isForm()) wireWrite();
  if (v === "board") wireBoard();
  if (v === "edit") wireEditor();
  if (v === "accounts") wireAccounts();
}
function flashHtml() { return S.flash ? `<div class="msg msg-${S.flash.kind}" role="status">${S.flash.text}</div>` : ""; }
function writeNotice() {
  return S.canWrite === false ? `<div class="msg msg-warn"><strong>You can read the newsroom but can't send stories yet.</strong> Ask management to invite you to this page as an Editor in Claude.</div>` : "";
}

/* ============ write ============ */
function accountsSorted() {
  return Object.values(S.accounts).filter(a => a.active !== false).sort((a, b) => (a.role === b.role ? a.name.localeCompare(b.name) : a.role === "management" ? -1 : 1));
}
function viewWrite() {
  const draft = S.editingId ? null : store.get(draftKey());
  const d = draft || {};
  const editing = S.editingId ? S.subs.find(s => s.id === S.editingId) : null;
  const src = editing || d;
  if (toonMode()) return `
  <h1 class="page-title">${editing ? "Edit and resend cartoon" : "Submit a cartoon"}</h1>
  <p class="lede">${editing ? "Make the changes management asked for, then send it back for review." : "Upload a political cartoon, give it a title and caption, and send it to management. Approved cartoons run in the Cartoons section on GNS."}</p>
  ${flashHtml()}${writeNotice()}
  ${editing && editing.reviewNote ? `<div class="msg msg-warn"><strong>Note from ${esc(editing.reviewedByName || "management")}:</strong> ${esc(editing.reviewNote)}</div>` : ""}
  <form class="write" id="write-form" novalidate>
    <div class="card write-main">
      <div class="field"><label for="f-headline">Cartoon title</label><input type="text" id="f-headline" maxlength="120" value="${esc(src.headline || "")}" placeholder="A short, punchy title"></div>
      <div class="field"><span class="label">Cartoon image</span><div id="cover-zone"></div></div>
      <div class="field"><label for="f-body">Caption</label><textarea id="f-body" rows="3" maxlength="400" style="min-height:0" placeholder="The line that runs under the cartoon">${esc(src.body || "")}</textarea>
        <div class="meta-row"><span>Shown under the cartoon on GNS.</span><span id="wc">${words(src.body || "")} words</span></div></div>
    </div>
    <div class="write-side">
      <div class="card side-box">
        <span class="label" id="byline-label">Cartoonist</span>
        <input type="text" class="picker-search" id="pick-q" placeholder="Search staff" aria-label="Search staff">
        <div class="picker" id="picker" role="radiogroup" aria-labelledby="byline-label"></div>
      </div>
      <div class="card side-box">
        <div class="field"><label for="f-tag">Label <span class="hint" style="font-weight:400">(optional)</span></label><input type="text" id="f-tag" maxlength="30" value="${esc(src.tag || "")}" placeholder="e.g. Satire"></div>
      </div>
      <div class="send-row">
        <p class="err" id="w-err" role="alert" hidden></p>
        <button type="button" class="btn" id="w-preview">Preview on GNS</button>
        <button type="submit" class="btn btn-primary" id="w-send">${editing ? "Resend to management" : "Send to management"}</button>
        ${editing ? `<button type="button" class="btn" id="w-cancel">Cancel editing</button>` : `<p class="hint">Your title and caption save on this device as you type.</p>`}
      </div>
    </div>
  </form>`;
  return `
  <h1 class="page-title">${editing ? "Edit and resend" : "Write a story"}</h1>
  <p class="lede">${editing ? "Make the changes management asked for, then send it back for review." : "Write your story, add a cover image, pick who wrote it, and send it to management. Approved stories run on the GNS site."}</p>
  ${flashHtml()}${writeNotice()}
  ${editing && editing.reviewNote ? `<div class="msg msg-warn"><strong>Note from ${esc(editing.reviewedByName || "management")}:</strong> ${esc(editing.reviewNote)}</div>` : ""}
  <form class="write" id="write-form" novalidate>
    <div class="card write-main">
      <div class="field"><label for="f-headline">Headline</label><input type="text" id="f-headline" maxlength="160" value="${esc(src.headline || "")}" placeholder="What happened, in one line"></div>
      <div class="field"><label for="f-dek">Subheadline <span class="hint" style="font-weight:400">(optional)</span></label><input type="text" id="f-dek" maxlength="240" value="${esc(src.dek || "")}" placeholder="One sentence that sells the story"></div>
      <div class="field">
        <label for="f-body">Story</label>
        <textarea id="f-body" placeholder="Start writing…">${esc(src.body || "")}</textarea>
        <div class="meta-row"><span>Leave a blank line between paragraphs. Start a line with ## for a subheading, or &gt; for a pull quote.</span><span id="wc">${words(src.body || "")} words</span></div>
      </div>
    </div>
    <div class="write-side">
      <div class="card side-box">
        <span class="label" id="byline-label">Byline: who wrote it</span>
        <input type="text" class="picker-search" id="pick-q" placeholder="Search staff" aria-label="Search staff">
        <div class="picker" id="picker" role="radiogroup" aria-labelledby="byline-label"></div>
      </div>
      <div class="card side-box">
        <div class="two">
          <div class="field"><label for="f-section">Section</label><select id="f-section">${SECTIONS.map(s => `<option${(src.section || "Politics") === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select></div>
          <div class="field"><label for="f-tag">Label <span class="hint" style="font-weight:400">(optional)</span></label><input type="text" id="f-tag" maxlength="30" value="${esc(src.tag || "")}" placeholder="e.g. Op-Ed"></div>
        </div>
      </div>
      <div class="card side-box">
        <span class="label">Cover image <span class="hint" style="font-weight:400">(optional)</span></span>
        <div id="cover-zone"></div>
        <div class="field"><label for="f-credit" class="hint" style="font-weight:600">Photo caption or credit</label><input type="text" id="f-credit" maxlength="140" value="${esc(src.coverCredit || "")}" placeholder="e.g. Photographed by Henry Reyes"></div>
      </div>
      <div class="send-row">
        <p class="err" id="w-err" role="alert" hidden></p>
        <button type="button" class="btn" id="w-preview">Preview on GNS</button>
        <button type="submit" class="btn btn-primary" id="w-send">${editing ? "Resend to management" : "Send to management"}</button>
        ${editing ? `<button type="button" class="btn" id="w-cancel">Cancel editing</button>` : `<p class="hint">Your draft saves on this device as you type.</p>`}
      </div>
    </div>
  </form>`;
}
function refreshPicker() {
  const box = $("picker"); if (!box) return;
  const q = ($("pick-q").value || "").trim().toLowerCase();
  const cur = box.querySelector("input:checked")?.value || box.dataset.sel || S.me.id;
  const list = accountsSorted().filter(a => !q || (a.name + " " + (a.title || "")).toLowerCase().includes(q));
  box.dataset.sel = cur;
  box.innerHTML = list.length ? list.map(a => `<label><input type="radio" name="author" value="${esc(a.id)}"${a.id === cur ? " checked" : ""}><span><span class="pn">${esc(a.name)}</span><span class="pt">${esc(a.title || "")}</span></span></label>`).join("")
    : `<p class="none">No one matches "${esc(q)}".</p>`;
}
function renderCoverZone() {
  const z = $("cover-zone"); if (!z) return;
  const toon = toonMode();
  if (S.cover) {
    z.innerHTML = `<div class="${toon ? "toon-prev" : "cover-prev"}"><img src="${S.cover}" alt="${toon ? "Cartoon preview" : "Cover image preview"}"><button type="button" id="cover-remove">Remove</button></div>`;
    $("cover-remove").onclick = () => { S.cover = null; S.coverKept = false; renderCoverZone(); };
  } else {
    z.innerHTML = `<label class="drop${toon ? " toon-drop" : ""}" id="drop" for="f-cover"><span><strong>${toon ? "Add the cartoon" : "Add a photo"}</strong><br>Tap to choose, or drop an image here</span><input type="file" id="f-cover" accept="image/*" hidden></label>`;
    $("f-cover").onchange = e => { const f = e.target.files && e.target.files[0]; if (f) loadCover(f); };
    const drop = $("drop");
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) loadCover(f); };
  }
}
async function loadCover(file) {
  const err = $("w-err");
  if (!file.type.startsWith("image/")) { err.textContent = "That file isn't an image. Choose a JPG, PNG or WEBP."; err.hidden = false; return; }
  try {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = Math.min(toonMode() ? 1600 : 1400, img.naturalWidth), q = 0.82, out = "";
    for (let tries = 0; tries < 12; tries++) {
      const h = Math.round(img.naturalHeight * w / img.naturalWidth);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      out = c.toDataURL("image/jpeg", q);
      if (out.length <= COVER_BUDGET) break;
      if (q > 0.55) q -= 0.08; else w = Math.round(w * 0.82);
    }
    if (out.length > COVER_BUDGET) throw new Error("too big");
    S.cover = out; S.coverKept = false; err.hidden = true; renderCoverZone();
  } catch (e) { err.textContent = "That image couldn't be used. Try a different photo."; err.hidden = false; }
}
let draftTimer = null;
function saveDraft() {
  if (S.editingId) return;
  clearTimeout(draftTimer);
  const key = draftKey();
  draftTimer = setTimeout(() => { if ($("write-form")) store.set(key, readForm()); }, 500);
}
function readForm() {
  const val = id => $(id) ? $(id).value : "";
  const toon = toonMode();
  return { kind: toon ? "cartoon" : "story", headline: val("f-headline").trim(), dek: toon ? "" : val("f-dek").trim(), body: val("f-body"), section: toon ? "Cartoons" : val("f-section"),
           tag: val("f-tag").trim(), coverCredit: toon ? "" : val("f-credit").trim(), author: $("picker").querySelector("input:checked")?.value || "" };
}
async function wireWrite() {
  refreshPicker();
  const editing = S.editingId ? S.subs.find(s => s.id === S.editingId) : null;
  if (editing) {

function gnsDate(d) {
  try {
    const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }).format(d);
    return p.replace(/,(?= \d{1,2}:)/, "").replace(" at ", " ") + " EST";
  } catch (e) { return d.toDateString(); }
}
function gnsBodyHtml(text) {
  const blocks = String(text).replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => {
    if (b.startsWith("## ")) return `<h2 class="gp-sub">${esc(b.slice(3))}</h2>`;
    if (b.startsWith("> ")) return `<blockquote>${b.replace(/^> ?/gm, "").split("\n").filter(Boolean).map(l => `<p>${esc(l)}</p>`).join("")}</blockquote>`;
    return `<p>${esc(b).replace(/\n/g, "<br>")}</p>`;
  }).join("");
}
function missingParts(f) {
  if (f.kind === "cartoon") return [!f.headline && "a title", !S.cover && "the cartoon image", !f.body.trim() && "a caption", !S.accounts[f.author] && "the cartoonist"].filter(Boolean);

}

async function submitStory(ev) {

    ev.preventDefault();
    const text = $("tip-text").value.trim(), err = $("tip-err"); err.hidden = true;
    if (text.length < 15) { err.textContent = "Add a bit more detail so there's something to write about."; err.hidden = false; return; }
    try {
      await S.db.collection("tips").doc().set({ text, by: S.me.id, byName: S.me.name, at: new Date().toISOString() });
      S.tipDraft = ""; $("tip-text").value = "";
    } catch (e) { err.textContent = errText(e); err.hidden = false; }
  };
  $("tip-list").onclick = async e => {
    const b = e.target.closest("[data-tipdel]"); if (!b) return;
    b.disabled = true;
    try { await S.db.doc("tips/" + b.dataset.tipdel).delete(); } catch (x) { b.disabled = false; }
  };
  $("v-app").querySelectorAll("[data-ed]").forEach(b => b.onclick = () => openEditorial(b.dataset.ed));
}
function openEditorial(id) {
  const e = S.eds.find(x => x.id === id); if (!e) return;
  S.edOpen = { type: "draft", id }; S.view = "edit"; S.flash = null;
  if (e.status !== "sent" && e.claimedBy !== S.me.id) {
    S.db.doc("editorials/" + id).update({ claimedBy: S.me.id, claimedByName: S.me.name, claimedAt: new Date().toISOString() }).catch(() => {});
  }
  renderChrome(); render(); window.scrollTo(0, 0);
}
function edSource() {
  const o = S.edOpen; if (!o) return null;
  return o.type === "draft" ? S.eds.find(x => x.id === o.id) || null : S.subs.find(x => x.id === o.id) || null;
}
const edKey = () => "gns-editorial-draft-" + S.me.id + "-" + (S.edOpen ? S.edOpen.id : "");
function edLocked() {
  const o = S.edOpen; if (!o || o.type !== "draft") return false;
  const e = edSource();
  return !e || !S.batch || S.batch.id !== e.batch || !!S.batch.sentBy;
}
function edLockHtml() {
  if (!edLocked()) return "";
  const b = S.batch;
  if (b && b.sentBy) return `<div class="msg msg-warn"><strong>This hour's syndicated has already been sent</strong> by ${esc(b.sentByName || "another staff member")}. You can't send this one. A fresh set arrives at the top of the hour.</div>`;
  return `<div class="msg msg-warn"><strong>This set has been replaced.</strong> Go back to the board to pick from the new syndicateds.</div>`;
}
function viewEditor() {
  const src = edSource();
  if (!src) return `<div class="card empty"><strong>That syndicated isn't available anymore</strong>It may have been replaced by a new set. <button type="button" class="linkbtn" id="ed-back">Back to the board</button></div>`;
  const resend = S.edOpen.type === "resend";
  const d = store.get(edKey()) || {};
  const val = k => d[k] !== undefined ? d[k] : (src[k] || "");
  const checks = src.checks || [];
  const ticked = new Set(d.ticked || []);
  return `<h1 class="page-title">${resend ? "Edit and resend syndicated" : "Fix this syndicated"}</h1>
  <p class="lede">${resend ? "Make the changes management asked for, then send it back for review." : "This syndicated has deliberate mistakes. Find and fix each one in the text, tick it off, then send it to management. It runs in Editorial Pieces under the GNS Editorial Team byline, with no cover image."}</p>
  ${flashHtml()}${writeNotice()}
  ${resend && src.reviewNote ? `<div class="msg msg-warn"><strong>Note from ${esc(src.reviewedByName || "management")}:</strong> ${esc(src.reviewNote)}</div>` : ""}
  <div id="ed-lock">${edLockHtml()}</div>
  <form class="write" id="ed-form" novalidate>
    <div class="card write-main">
      <div class="field"><label for="f-headline">Headline</label><input type="text" id="f-headline" maxlength="160" value="${esc(val("headline"))}"></div>
      <div class="field"><label for="f-dek">Subheadline <span class="hint" style="font-weight:400">(optional)</span></label><input type="text" id="f-dek" maxlength="240" value="${esc(val("dek"))}"></div>
      <div class="field">
        <label for="f-body">Article</label>
        <textarea id="f-body">${esc(val("body"))}</textarea>
        <div class="meta-row"><span>Leave a blank line between paragraphs. Start a line with ## for a subheading, or &gt; for a pull quote.</span><span id="wc">${words(val("body"))} words</span></div>
      </div>
    </div>
    <div class="write-side">
      <div class="card side-box">
        <span class="label" id="chk-label">Mistakes to fix (${checks.length})</span>
        <p class="hint">Tick each one once you've fixed it in the text.</p>
        <div class="checks" role="group" aria-labelledby="chk-label">${checks.map((c, i) => `<label><input type="checkbox" data-chk="${i}"${ticked.has(i) ? " checked" : ""}><span>${esc(c.label)}</span></label>`).join("") || `<p class="hint" style="padding:10px 12px">No checklist for this one.</p>`}</div>
      </div>
      <div class="card side-box fixed-meta">
        <div><strong>Byline:</strong> ${ED_BYLINE}</div>
        <div><strong>Section:</strong> ${ED_SECTION}</div>
        <span>No cover image. Bylines and sections are fixed for syndicateds.</span>
      </div>
      <div class="send-row">
        <p class="err" id="ed-err" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary" id="ed-send"${edLocked() ? " disabled" : ""}>${resend ? "Resend to management" : "Send to management"}</button>
        <button type="button" class="btn" id="ed-back">${resend ? "Cancel" : "Back to the board"}</button>
        <p class="hint">Your edits save on this device as you type.</p>
      </div>
    </div>
  </form>`;
}
function edRead() {
  return { headline: $("f-headline").value.trim(), dek: $("f-dek").value.trim(), body: $("f-body").value,
           ticked: [...$("ed-form").querySelectorAll("[data-chk]")].filter(b => b.checked).map(b => +b.dataset.chk) };
}
let edTimer = null;
function wireEditor() {
  $("ed-back").onclick = () => { const back = S.edOpen && S.edOpen.type === "resend" ? "mine" : "board"; S.edOpen = null; S.view = back; S.flash = null; renderChrome(); render(); window.scrollTo(0, 0); };
  const form = $("ed-form"); if (!form) return;
  const save = () => { clearTimeout(edTimer); const k = edKey(); edTimer = setTimeout(() => { if ($("ed-form")) store.set(k, edRead()); }, 400); };
  form.addEventListener("input", save);
  form.addEventListener("change", save);
  $("f-body").addEventListener("input", () => { $("wc").textContent = words($("f-body").value) + " words"; });
  form.onsubmit = sendEditorial;
}
async function sendEditorial(ev) {
  ev.preventDefault();
  const src = edSource(), err = $("ed-err"); err.hidden = true;
  if (!src) return;
  const resend = S.edOpen.type === "resend";
  const f = edRead(), checks = src.checks || [];
  const fail = t => { err.textContent = t; err.hidden = false; };
  if (!f.headline) return fail("Add a headline.");
  if (words(f.body) < 30) return fail("The syndicated needs at least 30 words.");
  if (f.ticked.length < checks.length) return fail("Tick off every item on the checklist first.");
  const text = [f.headline, f.dek, f.body].join("\n");
  const left = checks.map((c, i) => ({ c, i })).filter(x => x.c.wrong && text.includes(x.c.wrong));
  if (left.length) {
    left.forEach(x => { const b = $("ed-form").querySelector(`[data-chk="${x.i}"]`); if (b) b.checked = false; });
    store.set(edKey(), edRead());
    return fail("Not quite. Still needs fixing: " + left.map(x => x.c.label).join("; ") + ".");
  }
  if (!resend && edLocked()) return fail("This hour's syndicated has already been sent, so this one can't go to management.");
  const btn = $("ed-send"); btn.disabled = true; btn.textContent = "Sending…";
  const now = new Date().toISOString();
  try {
    if (resend) {
      await S.db.doc("submissions/" + src.id).update({ headline: f.headline, dek: f.dek, body: f.body, words: words(f.body), status: "pending", reviewNote: "", updatedAt: now, resubmittedAt: now });
    } else {
      const bd = await S.db.doc("editorialBatches/" + src.batch).get();
      if (!bd.exists || bd.data().sentBy) { btn.textContent = "Send to management"; return fail("Someone just sent this hour's syndicated, so this one can't go to management."); }
      const ref = S.db.collection("submissions").doc();
      await ref.set({ kind: "editorial", headline: f.headline, dek: f.dek, body: f.body, section: ED_SECTION, tag: "Editorial", coverCredit: "", hasCover: false,
                      authorId: "", authorName: ED_BYLINE, authorTitle: "", words: words(f.body), status: "pending", reviewNote: "", updatedAt: now,
                      submittedBy: S.me.id, submittedByName: S.me.name, submittedAt: now, editorialId: src.id, batch: src.batch, checks });
      await S.db.doc("editorialBatches/" + src.batch).update({ sentBy: S.me.id, sentByName: S.me.name, sentAt: now, submissionId: ref.id, editorialId: src.id, headline: f.headline });
      try { await S.db.doc("editorials/" + src.id).update({ status: "sent", sentBy: S.me.id, sentByName: S.me.name, sentAt: now, submissionId: ref.id }); } catch (e) {}
    }
    store.del(edKey());
    S.flash = { kind: "ok", text: `<strong>Sent to management.</strong> The syndicated “${esc(f.headline)}” is waiting for review. Once approved it goes live in Editorial Pieces within the hour.` };
    S.edOpen = null; S.view = "mine"; renderChrome(); render(); window.scrollTo(0, 0);
  } catch (e) {
    fail(errText(e)); btn.disabled = false; btn.textContent = resend ? "Resend to management" : "Send to management";
  }
}

/* ============ accounts (management) ============ */
function genPassword() {
  const w = ["Gavel", "Ledger", "Anchor", "Bulletin", "Capitol", "Byline", "Dispatch", "Headline", "Ballot", "Lantern", "Harbor", "Granite"];
  const a = new Uint32Array(3); crypto.getRandomValues(a);
  return `${w[a[0] % w.length]}-${w[a[1] % w.length]}-${1000 + (a[2] % 9000)}`;
}
function viewAccounts() {
  const all = Object.values(S.accounts).sort((a, b) => (a.role === b.role ? a.name.localeCompare(b.name) : a.role === "management" ? -1 : 1));
  return `<h1 class="page-title">Staff accounts</h1>
  <p class="lede">Everyone listed here can sign in and shows up in the byline list. Give new staff their username and password yourself.</p>
  ${flashHtml()}
  <div class="acct-grid">
    <div class="card table-wrap"><table>
      <thead><tr><th>Name</th><th>Username</th><th>Role</th><th><span class="hint">Actions</span></th></tr></thead>
      <tbody>${all.map(a => `<tr class="${a.active === false ? "inactive" : ""}">
        <td><strong>${esc(a.name)}</strong><div class="small">${esc(a.title || "")}</div></td>
        <td>${esc(a.username || a.id)}</td>
        <td><span class="role ${a.role === "management" ? "mgmt" : ""}">${a.role === "management" ? "Management" : "Staff"}</span>${a.active === false ? ' <span class="small">Deactivated</span>' : ""}</td>
        <td style="white-space:nowrap">${a.id === S.me.id ? '<span class="small">You</span>' : `<button type="button" class="linkbtn" data-reset="${esc(a.id)}">Reset password</button><button type="button" class="linkbtn" data-toggle="${esc(a.id)}">${a.active === false ? "Reactivate" : "Deactivate"}</button>`}</td>
      </tr>`).join("")}</tbody></table></div>
    <form class="card side-box" id="acct-form" novalidate>
      <h2 style="margin:0;font-size:18px">Add an account</h2>
      <div class="field"><label for="a-name">Full name</label><input type="text" id="a-name" maxlength="80" placeholder="e.g. Joseph Reyes-McCollum"></div>
      <div class="field"><label for="a-title">Title</label><input type="text" id="a-title" maxlength="80" placeholder="e.g. Senior Political Correspondent"></div>
      <div class="field"><label for="a-user">Username</label><input type="text" id="a-user" maxlength="32" autocapitalize="none" spellcheck="false" placeholder="Letters and numbers, no spaces"></div>
      <div class="field"><label for="a-pass">Password</label><div class="pw-row"><input type="text" id="a-pass" maxlength="64" value="${genPassword()}"><button type="button" class="btn" id="a-gen">New</button></div></div>
      <div class="field"><label for="a-role">Role</label><select id="a-role"><option value="staff">Staff: can write and send stories</option><option value="management">Management: can also approve</option></select></div>
      <p class="err" id="a-err" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
  </div>`;
}
function wireAccounts() {
  $("a-gen").onclick = () => { $("a-pass").value = genPassword(); };
  $("acct-form").onsubmit = async ev => {
    ev.preventDefault();
    const err = $("a-err"); err.hidden = true;
    const name = $("a-name").value.trim(), title = $("a-title").value.trim(), user = $("a-user").value.trim(), pass = $("a-pass").value, role = $("a-role").value;
    const bad = !name ? "Add their full name." : !/^[A-Za-z0-9_.-]{3,32}$/.test(user) ? "Usernames are 3 to 32 letters, numbers, dots, dashes or underscores." : S.accounts[user.toLowerCase()] ? "That username is taken." : pass.length < 8 ? "Passwords need at least 8 characters." : "";
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    try {
      await S.db.doc("accounts/" + user.toLowerCase()).set({ username: user, name, title, role, hash: await hashFor(user, pass), active: true, createdAt: new Date().toISOString(), createdBy: S.me.id });
      S.flash = { kind: "ok", text: `<strong>Account created for ${esc(name)}.</strong> Give them username <strong>${esc(user)}</strong> and password <strong>${esc(pass)}</strong>. This is the only time the password is shown.` };
      render(); window.scrollTo(0, 0);
    } catch (e) { err.textContent = errText(e); err.hidden = false; }
  };
  $("v-app").querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
    const a = S.accounts[b.dataset.toggle]; b.disabled = true;
    try { await S.db.doc("accounts/" + a.id).update({ active: a.active === false }); S.flash = { kind: "ok", text: `<strong>${esc(a.name)}</strong> is ${a.active === false ? "active again" : "deactivated and can no longer sign in"}.` }; render(); }
    catch (e) { S.flash = { kind: "warn", text: errText(e) }; render(); }
  });
  $("v-app").querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => {
    const a = S.accounts[b.dataset.reset], pass = genPassword(); b.disabled = true;
    try { await S.db.doc("accounts/" + a.id).update({ hash: await hashFor(a.username || a.id, pass) }); S.flash = { kind: "ok", text: `<strong>New password for ${esc(a.name)}:</strong> ${esc(pass)} (username ${esc(a.username || a.id)}). Their old password no longer works.` }; render(); window.scrollTo(0, 0); }
    catch (e) { S.flash = { kind: "warn", text: errText(e) }; render(); }
  });
}
</script>
